services:
  pulse:
    build: .
    ports:
      - "127.0.0.1:${PULSE_PORT:-8080}:80"
    volumes:
      - pulse-data:/var/www/html/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

volumes:
  pulse-data:
