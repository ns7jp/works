name: Static site check

on:
  push:
  pull_request:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check local HTML links
        run: node scripts/check-static-links.js

  nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Build image
        run: docker build --tag magicmoon:test .

      - name: Validate Nginx configuration
        run: docker run --rm magicmoon:test nginx -t
